version: '3.8'

networks:
  tezza-network:
    driver: bridge

services:
  # --- Central Configuration Management Server ---
  config-server:
    build:
      context: .  # Set context to root so Maven can see all modules
      dockerfile: ./services/config-server/Dockerfile
    ports:
      - "8888:8888"
    environment:
      CONFIG_ENCRYPT_KEY: ${CONFIG_ENCRYPT_KEY:?set CONFIG_ENCRYPT_KEY before starting}
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:config-client}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?set CONFIG_SERVER_PASSWORD before starting}
    networks:
      - tezza-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Messaging Infrastructure ---
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - tezza-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Cache & Gateway Rate Limiting Infrastructure ---
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    networks:
      - tezza-network

  # --- Reactive Routing API Gateway ---
  gateway-service:
    build:
      context: .  # Set context to root to safely pull down common-contracts
      dockerfile: ./services/gateway-service/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      # Use container names instead of host.docker.internal for local DNS resolution
      CONFIG_SERVER_URL: http://config-server:8888
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      PRODUCT_SERVICE_URL: http://product-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      LOAN_SERVICE_URL: http://loan-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    networks:
      - tezza-network
