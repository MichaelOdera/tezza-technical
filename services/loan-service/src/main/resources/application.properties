spring.application.name=loan-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-client}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}
server.port=8083
spring.datasource.url=jdbc:h2:file:./data/loan-db
spring.jpa.hibernate.ddl-auto=update
# schema.sql and data.sql are reference artifacts; loans require cross-service IDs.
spring.sql.init.mode=never
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
services.product-url=${PRODUCT_SERVICE_URL:}
services.customer-url=${CUSTOMER_SERVICE_URL:}
services.sweep-fixed-delay-ms=${LOAN_SWEEP_FIXED_DELAY_MS:3600000}