spring.application.name=notification-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-client}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}
server.port=8084
spring.datasource.url=jdbc:h2:file:./data/notification-db
spring.jpa.hibernate.ddl-auto=update
# schema.sql and data.sql are reference artifacts; notifications come from RabbitMQ.
spring.sql.init.mode=never
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}