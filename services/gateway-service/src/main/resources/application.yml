spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:config-client}
      password: ${CONFIG_SERVER_PASSWORD:}

    # Restructured for Spring Boot 4 / WebFlux Gateway Server Matrix
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**
            - id: customer-service
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/customers/**
            - id: loan-service
              uri: ${LOAN_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/loans/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**

  codec:
    max-in-memory-size: 2MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

# Keep your custom business logic mapping separated from native Spring structures
tezza:
  gateway:
    security:
      jwt-secret: ${GATEWAY_JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
      issuer: ${GATEWAY_JWT_ISSUER:tezza-gateway}
      public-paths:
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /actuator/health
    rate-limit:
      requests-per-minute: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE:60}
      redis:
        enabled: ${GATEWAY_RATE_LIMIT_REDIS_ENABLED:true}
        key-prefix: ${GATEWAY_RATE_LIMIT_REDIS_KEY_PREFIX:tezza:gateway:rate-limit:}
        window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
