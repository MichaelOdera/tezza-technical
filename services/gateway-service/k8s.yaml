apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway-service } }
  template:
    metadata: { labels: { app: gateway-service } }
    spec:
      containers:
        - name: gateway-service
          image: tezza/gateway-service:0.0.1
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: tezza-service-config }
            - secretRef: { name: tezza-runtime-secrets }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata: { name: gateway-service }
spec:
  selector: { app: gateway-service }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: tezza-gateway }
spec:
  to: { kind: Service, name: gateway-service }
  port: { targetPort: 8080 }
  tls:
    termination: edge